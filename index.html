<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Portfolio | Lorenzo BALADIER</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="css/style.css">
	<script src="js/lang.js" defer></script>
	<script src="js/script.js" defer></script>
	<script src="js/game.js" defer></script>
</head>

<body class="theme-dark">
	<div id="curtain">
		<video id="videoBackground" autoplay muted loop>
			<source src="assets/code.mp4" type="video/mp4">
		</video>
		<div id="videoOverlay"></div>
		<div id="content">
			<h1>PORTFOLIO</h1>
			<p class="subtitle">Lorenzo BALADIER</p>
			<button id="enterButton">
				<span class="shadow"></span>
				<span class="edge"></span>
				<span class="front text"> Entrer </span>
			</button>
		</div>
	</div>

	<div id="terminal">
		<div class="terminal-header">
			<div id="quitButton" class="button close"></div>
			<div id='closeButton' class="button minimize"></div>
			<div id='expandButton' class="button expand"></div>
			<span>Portfolio de Lorenzo BALADIER</span>
		</div>
		<div class="terminal-body">
			<p>Bienvenue dans mon portfolio! Tapez <i>/help</i> pour voir les commandes disponibles.</p>
			<label for="userInput" class="label-text">C:\Users\blorenzo&gt;</label>
			<input type="text" id="userInput" placeholder="Veuillez saisir une commande...">
			<div class="suggestions">
				<ul id="suggestions-list"></ul>
			</div>
			<div id="output"></div>
			<div id="snakeGame">
				<h1 id="gameOver" style="display: none;">GAME OVER</h1>
				<canvas id="gameCanvas" width="300" height="300"></canvas>
				<p>Score: <span id="score">1</span></p>
				<button id="replay" class="buttonGame">Rejouer</button>
				<button id="quit" class="buttonGame">Quitter</button>
			</div>
		</div>
	</div>
	<div id="easter-egg">
		<img src="assets/sad.png" id="icon" alt="Mario triste">
		<button id="returnToTerminal" type="button" aria-label="Retour au terminal">Retour</button>
	</div>
	<img id="naviCursor" src="assets/navi.png" alt="" aria-hidden="true" hidden>
</body>

</html>
